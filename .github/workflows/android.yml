name: Build Ascend

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # Stable signing key (recommended). Add these repository secrets once:
      # ASCEND_KEYSTORE_BASE64, ASCEND_KEYSTORE_PASSWORD, ASCEND_KEY_ALIAS, ASCEND_KEY_PASSWORD
      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.ASCEND_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/ascend.jks"
            echo "ASCEND_KEYSTORE_FILE=$RUNNER_TEMP/ascend.jks" >> "$GITHUB_ENV"
            echo "Signing with the Ascend key."
          else
            echo "::warning::No ASCEND_KEYSTORE_BASE64 secret. Using a throwaway debug key; this APK cannot update one signed by a different key."
          fi
      - name: Build apps
        run: |
          # Full edition (for friends) and a Play test APK
          gradle assembleFullDebug assemblePlayDebug
          # Google Play upload bundle (needs the signing key)
          if [ -n "$ASCEND_KEYSTORE_FILE" ]; then gradle bundlePlayRelease; fi
        env:
          ASCEND_KEYSTORE_PASSWORD: ${{ secrets.ASCEND_KEYSTORE_PASSWORD }}
          ASCEND_KEY_ALIAS: ${{ secrets.ASCEND_KEY_ALIAS }}
          ASCEND_KEY_PASSWORD: ${{ secrets.ASCEND_KEY_PASSWORD }}
          ASCEND_PLAY_KEY: ${{ secrets.ASCEND_PLAY_KEY }}
      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/full/debug/*.apk out/Ascend-Full.apk
          cp app/build/outputs/apk/play/debug/*.apk out/Ascend-Play-test.apk
          if ls app/build/outputs/bundle/playRelease/*.aab >/dev/null 2>&1; then cp app/build/outputs/bundle/playRelease/*.aab out/Ascend-GooglePlay.aab; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Ascend-Full-APK
          path: out/Ascend-Full.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ascend-Play-test-APK
          path: out/Ascend-Play-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ascend-GooglePlay-AAB
          path: out/Ascend-GooglePlay.aab
          if-no-files-found: warn
